{% extends "base.html" %}
{% block content %}
<h1>Deforestation lookup</h1>
<p class="muted">Annual change in forest area (hectares). Negative values indicate forest loss.</p>

<form class="form" method="GET" action="{{ url_for('deforestation_page') }}">
  <div class="field">
    <label for="country">Country</label>
    <select id="country" name="country" required>
      <option value="" {% if not country %}selected{% endif %}>Select a country</option>
      {% for c in countries %}
        <option value="{{ c }}" {% if country==c %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="field">
    <label for="year">Year</label>
    <input id="year" name="year" inputmode="numeric" pattern="\d{4}" placeholder="e.g., 2020" value="{{ year or '' }}" required>
  </div>

  <button class="btn" type="submit">Look up</button>
</form>

{% if message %}
  <div class="result" role="status">{{ message }}</div>
{% endif %}

{% endblock %}
