<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ project }}{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="{{ url_for('homepage') }}">{{ project }}</a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ url_for('homepage') }}">Home</a>
          <a href="{{ url_for('country_page') }}">Dashboard</a>
          <a href="{{ url_for('about_page') }}">About</a>
        </nav>
      </div>
    </header>

    <main id="main" class="container main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>
          <strong>Data source:</strong> Our World in Data climate datasets.
        </p>
      </div>
    </footer>
  </body>
</html>
